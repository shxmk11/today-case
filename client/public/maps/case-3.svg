<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
<style>.w{fill:none;stroke:#fff;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}.t{fill:none;stroke:#AEAEB2;stroke-width:1;stroke-linecap:round}.g{fill:none;stroke:#636366;stroke-width:1.1;stroke-linejoin:round}.room{fill:none;stroke:#636366;stroke-width:1;stroke-dasharray:3 4}.lbl{font-family:-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;font-size:13px;font-weight:700;fill:#8E8E93}.fl{font-family:-apple-system,system-ui,sans-serif;font-size:11px;font-weight:800;fill:#8E8E93}</style>
